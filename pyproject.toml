[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-oauth"
version = "1.0.0"
description = "Secure GitHub OAuth authorization boundary for ECHO applications."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1"]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8.4,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
